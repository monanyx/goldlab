name: goldbot

# Every 15 minutes during the London and New York sessions, Monday-Friday.
# Hours are UTC: 06:01-21:46 covers London 08:00 (07:00 UTC in summer) through
# New York 17:00 (22:00 UTC in winter). Runs at :01/:16/:31/:46 so the 15-minute
# bar has closed. GitHub may start scheduled runs a few minutes late; the bot
# catches up on every bar it missed. Schedules only run on the default branch.
on:
  schedule:
    - cron: "1,16,31,46 6-21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "signal or paper (live is never allowed here)"
        required: false
        default: ""

permissions:
  contents: write  # to push the state branch

concurrency:
  group: goldbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Restore state
        run: scripts/state_sync.sh pull

      - name: Run one bot cycle
        env:
          GOLDBOT_MODE: ${{ github.event.inputs.mode || vars.GOLDBOT_MODE || 'signal' }}
          GOLDBOT_KILL_SWITCH: ${{ vars.GOLDBOT_KILL_SWITCH || 'false' }}
          GOLDBOT_ACCOUNT_BALANCE: ${{ vars.GOLDBOT_ACCOUNT_BALANCE || '' }}
          GOLDBOT_FORBID_LIVE: "1"  # live trading never runs on GitHub Actions
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m goldbot --config goldbot.toml run

      - name: Save state
        if: always()
        run: scripts/state_sync.sh push

      - name: Upload paper log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldbot-state
          path: |
            state/*.csv
            state/bot_state.json
          if-no-files-found: ignore
          retention-days: 30
