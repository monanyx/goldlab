name: research

# Real-data research run:
#   1. download >= 2 years of XAUUSD history (Twelve Data, the bot's own live feed;
#      falls back to Dukascopy, which tends to rate-limit GitHub's runners)
#   2. run the research lab on 15-minute bars (the bot's timeframe) -> REPORT.md + results/
#   3. replay the bot's exact live code path over the last 6 months and check it
#      matches the backtest -> results/replay_check.md
#   4. commit REPORT.md and results/ back (never directly to main: a run started
#      from main pushes to the `research-results` branch instead)
#
# Start it from Actions -> research -> Run workflow. A push to a claude/** working
# branch whose commit message contains [run-research] also starts it.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history to download"
        default: "2"
      source:
        description: "twelvedata (default, same feed as the bot) or dukascopy"
        default: "twelvedata"
  push:
    branches: ["claude/**"]

permissions:
  contents: write

concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-research]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      YEARS: ${{ github.event.inputs.years || '2' }}
      SOURCE: ${{ github.event.inputs.source || 'twelvedata' }}
      GOLDBOT_FORBID_LIVE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Download price history
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          START=$(date -u -d "-${YEARS} years -14 days" +%Y-%m-%d)
          END=$(date -u +%Y-%m-%d)
          fetch() {
            python -m goldlab "fetch-$1" --start "$START" --end "$END" --out data/ \
              && echo "DATA_SOURCE=$1" >> "$GITHUB_ENV"
          }
          OTHER=dukascopy; [ "$SOURCE" = "dukascopy" ] && OTHER=twelvedata
          echo "Downloading ${START} -> ${END} from ${SOURCE}"
          if ! fetch "$SOURCE"; then
            echo "::warning::${SOURCE} download failed, falling back to ${OTHER}"
            rm -f data/*.csv
            fetch "$OTHER"
          fi

      - name: Check data
        run: |
          python -m goldlab check-data --minutes 15
          python - <<'EOF'
          from goldlab.data import find_data_files, load_clean
          from pathlib import Path
          df, q = load_clean(find_data_files(Path("data")), target_minutes=15)
          days = (df.index[-1] - df.index[0]).days
          print(f"history: {days} days, {len(df):,} bars")
          if days < 540:
              raise SystemExit(f"::error::only {days} days of history; need about 2 years")
          EOF

      - name: Research run (REPORT.md)
        run: python -m goldlab run --minutes 15 --workers "$(nproc)"

      - name: Live-path replay on real data (last 6 months)
        run: |
          python -m goldbot --config goldbot.toml replay --data data/ \
            --start "$(date -u -d '-6 months' +%Y-%m-%d)" --out results/replay_check.md

      - name: Upload data and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-${{ github.run_id }}
          path: |
            data/*.csv
            REPORT.md
            results/
          if-no-files-found: ignore
          retention-days: 90

      - name: Commit REPORT.md and results
        if: always()
        run: |
          [ -f REPORT.md ] || { echo "no report produced"; exit 0; }
          git config user.name "goldlab-research"
          git config user.email "goldlab-research@users.noreply.github.com"
          git add -f REPORT.md results
          git commit -qm "Research results: ${YEARS}y XAUUSD M15 from ${DATA_SOURCE:-unknown source} (run ${{ github.run_id }})" \
            || { echo "results unchanged"; exit 0; }
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "main" ]; then
            git push --force origin "HEAD:refs/heads/research-results"
            echo "::notice::Results pushed to the research-results branch; open a pull request to merge them."
            exit 0
          fi
          for i in 1 2 3; do
            git push origin "HEAD:refs/heads/${BRANCH}" && exit 0
            git pull --rebase origin "${BRANCH}"
            sleep 5
          done
          exit 1
